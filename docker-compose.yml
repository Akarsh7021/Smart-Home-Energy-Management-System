services:
  postgres:
    image: postgres:17-alpine
    container_name: nightgrid-postgres
    restart: unless-stopped
    environment:
      # On the first run, the official image creates this database and
      # development login before executing the initialization SQL scripts.
      POSTGRES_DB: ${POSTGRES_DB:-nightgrid}
      POSTGRES_USER: ${POSTGRES_USER:-nightgrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nightgrid_dev_password}
    ports:
      # Expose PostgreSQL only to applications running on this computer.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Keeps database data when the container is restarted.
      - nightgrid-postgres-data:/var/lib/postgresql/data
      # Runs the schema and mock-data scripts when the volume is first created.
      - ./src/main/resources/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nightgrid-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nightgrid-api
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nightgrid}
      POSTGRES_USER: ${POSTGRES_USER:-nightgrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nightgrid_dev_password}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-strict}
    ports:
      # Keep the API private to this computer or the server reverse proxy.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nightgrid-network

volumes:
  nightgrid-postgres-data:

# This is managed by Compose: `up` creates it and `down` removes it.
networks:
  nightgrid-network:
    name: nightgrid-network
    driver: bridge

