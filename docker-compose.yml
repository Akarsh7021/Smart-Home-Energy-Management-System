services:
  postgres:
    image: postgres:17-alpine
    container_name: nightgrid-postgres
    restart: unless-stopped
    environment:
      # On the first run, the official image creates this database and
      # development login before executing the initialization SQL scripts.
      POSTGRES_DB: ${POSTGRES_DB:-nightgrid}
      POSTGRES_USER: ${POSTGRES_USER:-nightgrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nightgrid_dev_password}
    ports:
      # Expose PostgreSQL only to applications running on this computer.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Keeps database data when the container is restarted.
      - nightgrid-postgres-data:/var/lib/postgresql/data
      # Runs the schema and mock-data scripts when the volume is first created.
      - ./src/main/resources/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nightgrid-postgres-data:

