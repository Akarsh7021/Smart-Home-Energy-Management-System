# Application identity
spring.application.name=nightgrid

# Load local development values from .env when the file exists.
# Environment variables still override values loaded from this file.
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL connection used by Spring Data JPA and Spring Session.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nightgrid}
spring.datasource.username=${POSTGRES_USER:nightgrid}
spring.datasource.password=${POSTGRES_PASSWORD:nightgrid_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Application tables are managed manually with SQL scripts.
# Hibernate may validate the mappings, but must never create or modify tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Spring Session tables are the only exception to manual schema management.
# Spring Session may initialize its own JDBC tables automatically.
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=30m

# Session-cookie restrictions. Secure defaults to true so deployed cookies are
# HTTPS-only; set SESSION_COOKIE_SECURE=false only for a plain-HTTP local client.
server.servlet.session.cookie.name=NIGHTGRID_SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict

# Only this React origin may call the API with the session cookie.
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Let Swagger UI copy the CSRF cookie into the standard request header when
# using "Try it out". Call GET /api/auth/csrf before POST or PATCH operations.
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN
